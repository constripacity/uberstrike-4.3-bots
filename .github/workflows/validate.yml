name: Validate

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Determinism check
        timeout-minutes: 15
        run: |
          chmod +x scripts/validate-determinism.sh
          ./scripts/validate-determinism.sh
      - name: Benchmark suite
        timeout-minutes: 10
        run: |
          chmod +x scripts/benchmark.sh
          # Add retry logic for transient failures
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts"
            if OUTPUT_HEADER=false ./scripts/benchmark.sh > benchmark.csv; then
              echo "Benchmark completed successfully"
              break
            else
              exit_code=$?
              if [ $attempt -eq $max_attempts ]; then
                echo "Benchmark failed after $max_attempts attempts"
                exit $exit_code
              fi
              echo "Benchmark failed, retrying in 5 seconds..."
              sleep 5
              attempt=$((attempt + 1))
            fi
          done
      - name: Final validation (non-blocking)
        continue-on-error: true
        run: |
          chmod +x scripts/final-validation.sh
          ./scripts/final-validation.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: |
            benchmark.csv
            validation-report.json
            run-summary.json
